<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lyri_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lyri_web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script>
    async function _extractText(imagePath, mapData) {
      console.log("Extracting text using Tesseract.js. Input parameters:", mapData);
      var lang = mapData.language || 'eng';
      
      // Pass the language directly in createWorker for Tesseract.js v4+
      var worker = await Tesseract.createWorker(lang);
      
      if (mapData.args) {
        await worker.setParameters(mapData.args);
      }
      
      var rtn = await worker.recognize(imagePath);
      await worker.terminate();
      
      if (mapData.args && mapData.args["tessjs_create_hocr"]) {
        return rtn.data.hocr;
      }
      return rtn.data.text;
    }

    async function _captureFromWebcam() {
      if (!document.getElementById('webcam-styles')) {
        const style = document.createElement('style');
        style.id = 'webcam-styles';
        style.innerHTML = `
          #webcam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
          }
          #webcam-container {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
          }
          #webcam-video {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            background: #0f172a;
            transform: scaleX(-1);
          }
          #webcam-buttons {
            margin-top: 20px;
            display: flex;
            gap: 16px;
          }
          .webcam-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
          }
          .webcam-btn-capture {
            background: #3b82f6;
            color: white;
          }
          .webcam-btn-capture:hover {
            background: #2563eb;
          }
          .webcam-btn-cancel {
            background: #475569;
            color: #e2e8f0;
          }
          .webcam-btn-cancel:hover {
            background: #334155;
          }
        `;
        document.head.appendChild(style);
      }
      
      return new Promise(async (resolve) => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          resolve("NO_CAMERA");
          return;
        }

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 800 }, height: { ideal: 600 } } 
          });
        } catch (err) {
          console.error("Camera access error:", err);
          resolve("NO_CAMERA");
          return;
        }

        const overlay = document.createElement('div');
        overlay.id = 'webcam-overlay';

        const container = document.createElement('div');
        container.id = 'webcam-container';

        const title = document.createElement('h3');
        title.innerText = 'Capture Song Lyrics';
        title.style.margin = '0 0 16px 0';
        title.style.fontSize = '18px';
        title.style.fontWeight = 'bold';

        const video = document.createElement('video');
        video.id = 'webcam-video';
        video.autoplay = true;
        video.playsInline = true;
        video.srcObject = stream;

        const buttonContainer = document.createElement('div');
        buttonContainer.id = 'webcam-buttons';

        const captureBtn = document.createElement('button');
        captureBtn.className = 'webcam-btn webcam-btn-capture';
        captureBtn.innerText = 'Capture Photo';

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'webcam-btn webcam-btn-cancel';
        cancelBtn.innerText = 'Cancel';

        buttonContainer.appendChild(captureBtn);
        buttonContainer.appendChild(cancelBtn);

        container.appendChild(title);
        container.appendChild(video);
        container.appendChild(buttonContainer);
        overlay.appendChild(container);
        document.body.appendChild(overlay);

        captureBtn.onclick = () => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 800;
          canvas.height = video.videoHeight || 600;
          
          const ctx = canvas.getContext('2d');
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          
          stream.getTracks().forEach(track => track.stop());
          document.body.removeChild(overlay);
          resolve(dataUrl);
        };

        cancelBtn.onclick = () => {
          stream.getTracks().forEach(track => track.stop());
          document.body.removeChild(overlay);
          resolve("CANCELLED");
        };
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
